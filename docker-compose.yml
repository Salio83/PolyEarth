services:
  db:
    image: postgres:14
    container_name: "db-polyearth"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  api:
    build: ./backend
    container_name: "backend-deno"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - backend

  front:
    build: ./frontend
    container_name: "frontend-deno"
    volumes:
      - ./frontend:/app
    restart: unless-stopped
    networks:
      - public

  proxy:
    image: nginx:alpine
    container_name: "nginx-proxy"
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - api
    restart: unless-stopped
    networks:
      - public
      - backend

volumes:
  db-data:

networks:
  public:
    driver: bridge
  backend:
    driver: bridge
