services:
  db:
    image: postgres:14.7-alpine
    container_name: "db-polyearth"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-polyearth}
      - POSTGRES_USER=${POSTGRES_USER:-root}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: "backend-deno"
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=${POSTGRES_DB:-polyearth}
      - DB_USER=${POSTGRES_USER:-root}
      - DB_PASS=${POSTGRES_PASSWORD:-root}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: "frontend-deno"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

volumes:
  db-data:
