name: PolyEarth CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Étape 1 : Linting du code
  lint:
    name: Lint & Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.37.0

      - name: Run Linter (Backend)
        run: deno lint backend/

  # Étape 2 : Vérification de la construction Docker
  build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker Compose Build
        run: docker compose build

  # Étape 3 : Déploiement en Production (Continu)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.6
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH_NAME
          script: |
            # Accéder au dossier de l'application sur le serveur
            cd ~/PolyEarth || { echo "❌ Dossier ~/PolyEarth introuvable sur le serveur"; exit 1; }
            
            # Sauvegarder les modifications locales temporaires pour éviter les blocages de pull/checkout
            git stash
            
            # Récupérer les branches et forcer le passage sur la bonne branche qui a déclenché le workflow
            git fetch origin
            git checkout "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
            
            # Réappliquer les modifications locales si possible
            git stash pop || true
            
            # Relancer les conteneurs avec build automatique
            docker compose down
            docker compose up -d --build
            
            # Nettoyer les anciennes images Docker inutilisées
            docker image prune -f
