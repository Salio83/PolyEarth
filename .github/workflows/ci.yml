name: PolyEarth CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Étape 1 : Linting du code
  lint:
    name: Lint & Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.37.0

      - name: Run Linter (Backend)
        run: deno lint backend/

  # Étape 2 : Vérification de la construction Docker
  build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker Compose Build
        run: docker compose build

  # Étape 3 : Déploiement en Production (Continu)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # MODIFIER CE CHEMIN vers l'emplacement réel de votre application sur le serveur
            cd /home/${{ secrets.SSH_USER }}/PolyEarth
            
            # Récupérer la dernière version du code (détermine automatiquement la branche courante)
            git pull
            
            # Relancer les conteneurs avec build automatique
            docker compose down
            docker compose up -d --build
            
            # Nettoyer les anciennes images Docker inutilisées
            docker image prune -f
