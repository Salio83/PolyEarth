<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyEarth - Polytech Montpellier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <h1 onclick="navigate('/')" class="text-2xl font-black text-emerald-600 cursor-pointer tracking-tighter">PolyEarth</h1>
                <button onclick="navigate('/offres'); showAddItemModal();" class="hidden md:flex items-center space-x-2 bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    <span>Déposer une annonce</span>
                </button>
            </div>
            
            <div class="flex items-center space-x-6">
                <a href="/" onclick="event.preventDefault(); navigate('/')" class="flex flex-col items-center text-gray-600 hover:text-emerald-600 transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Accueil</span>
                </a>
                <a href="/offres" onclick="event.preventDefault(); navigate('/offres')" class="flex flex-col items-center text-gray-600 hover:text-emerald-600 transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Offres</span>
                </a>
                <a href="/association" onclick="event.preventDefault(); navigate('/association')" class="flex flex-col items-center text-gray-600 hover:text-emerald-600 transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Infos</span>
                </a>
                <a href="/profil" onclick="event.preventDefault(); navigate('/profil')" class="flex items-center space-x-2 pl-4 border-l border-gray-200 text-gray-700 hover:text-emerald-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span class="font-bold hidden sm:inline">Mon profil</span>
                </a>
            </div>
        </div>
    </header>

    <div id="content" class="container mx-auto py-8">
        <!-- Le contenu sera injecté ici par app.ts -->
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
