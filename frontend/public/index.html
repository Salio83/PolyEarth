<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyEarth — Partage étudiant</title>
    <meta name="description" content="Plateforme de prêt et d'emprunt entre étudiants de Polytech Montpellier.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-gray-50 font-['Inter'] text-gray-900 min-h-screen">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="container mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <h1 onclick="navigate('/')" class="text-xl font-black text-emerald-600 cursor-pointer tracking-tighter">🌱 PolyEarth</h1>
                <nav class="hidden md:flex items-center space-x-5">
                    <a href="/" class="text-sm font-semibold text-gray-500 hover:text-emerald-600 transition-colors">Accueil</a>
                    <a href="/offres" class="text-sm font-semibold text-gray-500 hover:text-emerald-600 transition-colors">Annonces</a>
                    <a href="/messages" class="text-sm font-semibold text-gray-500 hover:text-emerald-600 transition-colors relative" id="navMessages">
                        Messages
                        <span id="unreadBadge" class="hidden absolute -top-1.5 -right-3 bg-red-500 text-white text-[9px] font-black rounded-full w-4 h-4 flex items-center justify-center">0</span>
                    </a>
                    <a href="/prets" class="text-sm font-semibold text-gray-500 hover:text-emerald-600 transition-colors">Mes prêts</a>
                    <a href="/association" class="text-sm font-semibold text-gray-500 hover:text-emerald-600 transition-colors">Association</a>
                </nav>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="navigate('/profil')" class="flex items-center space-x-2 px-3 py-1.5 hover:bg-gray-50 rounded-lg transition-colors border border-transparent hover:border-gray-100">
                    <div class="w-7 h-7 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xs font-black" id="userInitial">U</div>
                    <span class="hidden sm:inline text-sm font-semibold" id="userNameHeader">Mon Compte</span>
                </button>
            </div>
        </div>
    </header>

    <div id="content" class="container mx-auto py-6 px-4">
        <!-- Content injected by app.js -->
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
